<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're invited · Sudoku Town</title>
<meta name="description" content="A friend invited you to play sudoku in Sudoku Town.">
<meta property="og:title" content="You're invited to Sudoku Town">
<meta property="og:description" content="Play sudoku with your friends.">
<style>
  :root { --navy: #15212A; --yellow: #FEE715; --page: #F4F1EA; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--page); color: var(--navy);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px;
  }
  .card {
    width: 100%; max-width: 420px; background: #fff; border: 4px solid var(--navy);
    border-radius: 28px; padding: 32px 24px; text-align: center; box-shadow: 6px 6px 0 #8A929A;
  }
  .logo {
    display: inline-grid; grid-template-columns: repeat(3, 34px); background: var(--yellow);
    border-radius: 12px; padding: 6px; font-weight: 900; font-size: 24px; line-height: 34px; margin-bottom: 20px;
  }
  h1 { margin: 0 0 8px; font-size: 34px; }
  p { margin: 0 0 24px; font-size: 18px; line-height: 1.4; }
  .btn {
    display: block; text-decoration: none; font-weight: 700; font-size: 20px;
    padding: 18px; border-radius: 18px; margin-top: 14px;
  }
  .open { background: var(--navy); color: #fff; }
  .play { background: #fff; color: var(--navy); border: 3px solid var(--navy); }
  .note { font-size: 14px; opacity: .7; margin: 18px 0 0; }
</style>
</head>
<body>
<main class="card">
  <div class="logo"><span>S</span><span>U</span><span>D</span><span>O</span><span>K</span><span>U</span><span>T</span><span>O</span><span>W</span></div>
  <h1 id="title">You're invited!</h1>
  <p>Play sudoku together in Sudoku Town.<br>Add each other as friends and race on the leaderboard.</p>
  <a class="btn open" id="open" href="#">Open in Sudoku Town</a>
  <a class="btn play" id="play" href="https://play.google.com/store/apps/details?id=com.sudokutown.app">Get it on Google Play</a>
  </main>
<script>
  var play = "https://play.google.com/store/apps/details?id=com.sudokutown.app";
  var m = location.pathname.match(/\/sudoku-town\/u\/([0-9a-fA-F-]{36})\/?$/);
  var id = m ? m[1].toLowerCase() : null;
  // Google Play passes "inv=<id>" to the app after install, so the inviter gets the reward.
  var playLink = id ? play + "&referrer=" + encodeURIComponent("inv=" + id) : play;
  document.getElementById("play").href = playLink;
  // Android with the app installed: open the app on the inviter's profile.
  document.getElementById("open").href =
    "intent://vilnius-riga.app" + location.pathname +
    "#Intent;scheme=https;package=com.sudokutown.app;S.browser_fallback_url=" + encodeURIComponent(playLink) + ";end";
  // "Ahmad invites you!" (only the username, nothing else)
  if (id) {
    fetch("https://www.eumaps.org/api/sudoku/invite/name/" + id)
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (j && j.resStatus && j.name) document.getElementById("title").textContent = j.name + " invites you!";
      })
      .catch(function () {});
  }
</script>
</body>
</html>
